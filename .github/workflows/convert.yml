name: OFAC SDN XML Conversion

on:
  workflow_dispatch:
    inputs:
      force:
        description: Reprocess even if this OFAC version already has a release
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

permissions: {}

concurrency: # Limit to only one processing job
  group: ofac-sdn-conversion
  cancel-in-progress: false

env:
  OFAC_SDN_ZIP_URL: >-
    https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_ENHANCED.ZIP

jobs:
  convert-ofac-xml:
    name: Convert and publish OFAC SDN data
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Download, validate, and hash source XML
        id: source
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/SDN_ENHANCED.zip"
          xml="${RUNNER_TEMP}/SDN_ENHANCED.XML"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 300 \
            --output "$archive" \
            "$OFAC_SDN_ZIP_URL"

          unzip -tq "$archive"

          # Check if zip contains expected XML file.
          if ! unzip -Z1 "$archive" |
            grep --fixed-strings --line-regexp --quiet 'SDN_ENHANCED.XML'
          then
            echo "::error::SDN_ENHANCED.XML was not present in the archive"
            exit 1
          fi

          # Extract only the expected file. Do not unpack arbitrary archive paths.
          unzip -p "$archive" 'SDN_ENHANCED.XML' > "$xml"

          if [[ ! -s "$xml" ]]; then
            echo "::error::Extracted XML is empty"
            exit 1
          fi

          size=$(stat --format='%s' "$xml")
          if (( size > 1073741824 )); then
            echo "::error::Extracted XML exceeds the 1 GiB safety limit"
            exit 1
          fi

          hash=$(sha256sum "$xml" | awk '{print $1}')
          tag="ofac-${hash}"

          printf 'hash=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'OFAC_XML=%s\n' "$xml" >> "$GITHUB_ENV"

          if [[ "$FORCE" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Forced reprocessing requested."
            exit 0
          fi

          # The hash-based release is the durable record of processed input.
          set +e
          error=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              >/dev/null 2>&1
          )
          status=$?
          set -e

          if (( status == 0 )); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A release already exists for XML hash ${hash}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New XML hash detected: ${hash}."
          fi

      - name: Checkout repository
        if: steps.source.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.source.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.source.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --requirement requirements.txt

      - name: Convert XML
        if: steps.source.outputs.changed == 'true'
        run: |
          set -euo pipefail

          python convert.py \
            --xml "$OFAC_XML" \
            --out out/

      - name: Validate generated files and create checksums
        if: steps.source.outputs.changed == 'true'
        run: |
          set -euo pipefail

          if [[ ! -d out ]] ||
             ! find out -maxdepth 1 -type f -print -quit | grep --quiet .
          then
            echo "::error::Conversion produced no files"
            exit 1
          fi

          (
            cd out
            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              -print0 |
              sort --zero-terminated |
              xargs --null sha256sum > SHA256SUMS
          )

      - name: Get release timestamp
        id: time
        if: steps.source.outputs.changed == 'true'
        run: |
          printf 'now=%s\n' \
            "$(date --utc +'%Y-%m-%d %H:%M:%S UTC')" \
            >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.source.outputs.changed == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.source.outputs.tag }}
          name: OFAC SDN Update – ${{ steps.time.outputs.now }}
          body: |
            New OFAC SDN Enhanced XML detected and processed.

            **Source XML SHA-256:** `${{ steps.source.outputs.hash }}`
            **Generated formats:** JSON, TOML, CSV, TXT
          files: out/*
          fail_on_unmatched_files: true